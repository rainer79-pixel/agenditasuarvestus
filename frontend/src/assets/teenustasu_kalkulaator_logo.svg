<svg width="680" height="160" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Teenustasu Kalkulaator logo</title>
<desc>Teenustasu Kalkulaator logo noolega kaardi alt keskelt</desc>
<defs>
  <marker id="arrowhead" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto">
    <polygon points="0,0 4,2 0,4" fill="#5db88a"/>
  </marker>
</defs>

<!-- Card shape -->
<g transform="translate(40, 54)">
  <rect x="0" y="0" width="72" height="52" rx="7" fill="#1a3a6b"/>
  <rect x="0" y="10" width="72" height="12" fill="#14539e"/>
  <rect x="8" y="30" width="28" height="5" rx="2" fill="#4a90d9" opacity="0.8"/>
  <rect x="8" y="38" width="18" height="4" rx="2" fill="#4a90d9" opacity="0.5"/>
  <rect x="8" y="14" width="14" height="10" rx="2" fill="#f0c040" opacity="0.9"/>
</g>

<!-- Bar chart -->
<g transform="translate(96, 44)">
  <rect x="0" y="30" width="10" height="22" rx="2" fill="#3d9e7a"/>
  <rect x="14" y="18" width="10" height="34" rx="2" fill="#4caf8a"/>
  <rect x="28" y="8" width="10" height="44" rx="2" fill="#14539e"/>
</g>

<!-- Nool -->
<path d="M 76,106 C 84,116 104,88 142,52" fill="none" stroke="#5db88a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowhead)"/>

<!-- Main text -->
<text x="162" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="0.5">
  <tspan fill="#1a3a6b">Teenustasu</tspan><tspan fill="#4caf8a"> Kalkulaator</tspan>
</text>

<!-- Subtitle -->
<text x="163" y="116" font-family="Arial, sans-serif" font-size="13" fill="#555" letter-spacing="3" font-weight="400">TEENUSTASU ARVUTAMISE SÜSTEEM</text>

</svg>
